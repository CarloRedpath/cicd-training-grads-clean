name: 2 - Create Release

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
        - name: Checkout step
          uses: actions/checkout@v4
        - name: Docker build
          run: docker build -t cicd-training-2026 .
        - name: Create Release
          id: create_release
          uses: comnoco/create-release@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
            with:
            tag_name: ${{ github.ref }}
            release_name: Release ${{ github.ref }}
            body: |
                Changes in this Release
                - First Change
                - Second Change
            draft: false
            prerelease: false